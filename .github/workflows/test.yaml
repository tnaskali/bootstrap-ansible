name: Test Ansible Setup Script

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os:
          - macOS-latest
          - ubuntu-latest
          - windows-latest
        include:
          - os: macOS-latest
            shell: bash
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: wsl -- dos2unix <"$(wslpath '{0}')" | bash --noprofile --norc -euo pipefail
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install WSL if on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\wsl\install.ps1
          echo "WSLENV=GITHUB_PATH/p" >> $env:GITHUB_ENV

      - name: Install Ansible
        run: |
          /usr/bin/env sh -c "$(cat ./ansible/install.sh)"

      - name: Ensure Ansible is in PATH
        if: runner.os == 'Windows'
        run: |
          echo "$(wslpath -w ${HOME}/.local/bin)" >> "${GITHUB_PATH}"

      - name: Verify Ansible installation
        run: |
          ansible --version

      - name: Verify Ansible configuration
        run: |
          ansible localhost -m ping
          ansible localhost -m command -a "echo \"Hello from Ansible on $(uname -a)\""
